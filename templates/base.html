<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Parking System{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="navbar-nav ms-auto">
    <a class="nav-link" href="{% url 'parkings:parking_list' %}">Парковки</a>

    {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'accounts:profile' %}">Мій кабінет</a>

        <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="nav-link btn btn-link text-decoration-none">
                Вийти
            </button>
        </form>
    {% else %}
        <a class="nav-link" href="{% url 'accounts:login' %}">Увійти</a>
        <a class="nav-link" href="{% url 'accounts:register' %}">Реєстрація</a>
    {% endif %}
</div>
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
        Інформаційна система паркування автомобілів
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
